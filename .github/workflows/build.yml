name: Build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
            compiler: msvc
          - name: Windows clang-cl
            os: windows-latest
            compiler: clang-cl
          - name: Linux Clang
            os: ubuntu-24.04
            compiler: clang

    steps:
      - name: Check out HLSL-LSP
        uses: actions/checkout@v5

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'

          $compiler = if ('${{ matrix.compiler }}' -eq 'msvc') {
            'cl.exe'
          } else {
            'clang-cl.exe'
          }
          cmake -S . -B out/build/ci -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_CXX_COMPILER="$compiler" `
            -DBUILD_TESTING=ON
          cmake --build out/build/ci --config Debug
          ctest --test-dir out/build/ci --build-config Debug --output-on-failure

      - name: Configure on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B out/build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTING=ON

      - name: Build
        if: runner.os == 'Linux'
        run: cmake --build out/build/ci --config Debug

      - name: Run Catch2 tests
        if: runner.os == 'Linux'
        run: ctest --test-dir out/build/ci --build-config Debug --output-on-failure

      - name: Build Visual Studio VSIX
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe |
            Select-Object -First 1
          & $msbuild `
            clients\visual-studio\HlslLsp.VisualStudio\HlslLsp.VisualStudio.csproj `
            /restore /p:Configuration=Release `
            /p:HlslLspServerDir="$env:GITHUB_WORKSPACE\out\build\ci"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Visual Studio VSIX
        if: matrix.compiler == 'msvc'
        uses: actions/upload-artifact@v6
        with:
          name: HLSL-LSP-Visual-Studio
          path: clients/visual-studio/HlslLsp.VisualStudio/bin/Release/net472/HlslLsp.VisualStudio.vsix

  vscode-client:
    name: Visual Studio Code VSIX
    runs-on: windows-latest

    steps:
      - name: Check out HLSL-LSP
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json

      - name: Build release server
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'

          cmake -S . -B out/build/vscode-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_CXX_COMPILER=cl.exe" `
            -DBUILD_TESTING=OFF
          cmake --build out/build/vscode-release --target hlsl-lsp

      - name: Install and stage VS Code client
        working-directory: clients/vscode
        shell: pwsh
        run: |
          npm ci
          npm run stage:runtime -- --server-dir ..\..\out\build\vscode-release

      - name: Check and test VS Code client
        working-directory: clients/vscode
        run: npm run check

      - name: Run extension-host smoke tests
        working-directory: clients/vscode
        run: npm run test:integration -- --server-path server\win32-x64\hlsl-lsp.exe

      - name: Package VS Code VSIX
        working-directory: clients/vscode
        run: npm run package

      - name: Upload Visual Studio Code VSIX
        uses: actions/upload-artifact@v6
        with:
          name: HLSL-LSP-Visual-Studio-Code
          path: clients/vscode/hlsl-lsp-vscode.vsix
          if-no-files-found: error
