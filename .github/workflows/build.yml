name: Build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
            compiler: msvc
            build-type: Release
          - name: Windows clang-cl
            os: windows-latest
            compiler: clang-cl
            build-type: Debug
          - name: Linux Clang
            os: ubuntu-24.04
            compiler: clang
            build-type: Release

    steps:
      - name: Check out HLSL-LSP
        uses: actions/checkout@v5

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'

          $compiler = if ('${{ matrix.compiler }}' -eq 'msvc') {
            'cl.exe'
          } else {
            'clang-cl.exe'
          }
          cmake -S . -B out/build/ci -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} `
            -DCMAKE_CXX_COMPILER="$compiler" `
            -DBUILD_TESTING=ON
          cmake --build out/build/ci --config ${{ matrix.build-type }}
          ctest --test-dir out/build/ci `
            --build-config ${{ matrix.build-type }} --output-on-failure

      - name: Configure on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B out/build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTING=ON

      - name: Build
        if: runner.os == 'Linux'
        run: cmake --build out/build/ci --config ${{ matrix.build-type }}

      - name: Run Catch2 tests
        if: runner.os == 'Linux'
        run: >-
          ctest --test-dir out/build/ci
          --build-config ${{ matrix.build-type }}
          --output-on-failure

      - name: Prove Linux DXC IntelliSense runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          env -u LD_LIBRARY_PATH \
            ./out/build/ci/hlsl-intellisense-tests "[linux-runtime]"
          cmake --install out/build/ci \
            --config ${{ matrix.build-type }} \
            --prefix out/package/linux-x64
          test -x out/package/linux-x64/hlsl-lsp
          test -f out/package/linux-x64/libdxcompiler.so
          readelf -d out/package/linux-x64/hlsl-lsp | grep -F '$ORIGIN'
          env -u LD_LIBRARY_PATH out/package/linux-x64/hlsl-lsp </dev/null

      - name: Package Windows x64 runtime
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          cmake --install out/build/ci `
            --config ${{ matrix.build-type }} `
            --prefix out/package/win32-x64

      - name: Upload Windows x64 runtime
        if: matrix.compiler == 'msvc'
        uses: actions/upload-artifact@v6
        with:
          name: HLSL-LSP-Windows-x64-runtime
          path: out/package/win32-x64
          if-no-files-found: error

      - name: Upload Linux x64 runtime
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: HLSL-LSP-Linux-x64-runtime
          path: out/package/linux-x64
          if-no-files-found: error

      - name: Build Visual Studio VSIX
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe |
            Select-Object -First 1
          & $msbuild `
            clients\visual-studio\HlslLsp.VisualStudio\HlslLsp.VisualStudio.csproj `
            /restore /p:Configuration=Release `
            /p:HlslLspServerDir="$env:GITHUB_WORKSPACE\out\build\ci"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Visual Studio VSIX
        if: matrix.compiler == 'msvc'
        uses: actions/upload-artifact@v6
        with:
          name: HLSL-LSP-Visual-Studio
          path: clients/visual-studio/HlslLsp.VisualStudio/bin/Release/net472/HlslLsp.VisualStudio.vsix

  vscode-client:
    name: Visual Studio Code VSIX
    needs: build-and-test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out HLSL-LSP
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json

      - name: Download Windows x64 runtime
        uses: actions/download-artifact@v6
        with:
          name: HLSL-LSP-Windows-x64-runtime
          path: out/runtime/win32-x64

      - name: Download Linux x64 runtime
        uses: actions/download-artifact@v6
        with:
          name: HLSL-LSP-Linux-x64-runtime
          path: out/runtime/linux-x64

      - name: Install and stage VS Code client
        working-directory: clients/vscode
        shell: bash
        run: |
          npm ci
          npm run stage:runtime -- \
            --platform win32-x64 \
            --server-dir ../../out/runtime/win32-x64
          npm run stage:runtime -- \
            --platform linux-x64 \
            --server-dir ../../out/runtime/linux-x64

      - name: Check and test VS Code client
        working-directory: clients/vscode
        run: npm run check

      - name: Run extension-host smoke tests
        working-directory: clients/vscode
        run: xvfb-run -a npm run test:integration -- --bundled

      - name: Package VS Code VSIX
        working-directory: clients/vscode
        run: npm run package

      - name: Verify packaged Linux executable mode
        working-directory: clients/vscode
        shell: bash
        run: |
          zipinfo -l hlsl-lsp-vscode.vsix |
            grep -E '^-rwx.*extension/server/linux-x64/hlsl-lsp$'

      - name: Upload Visual Studio Code VSIX
        uses: actions/upload-artifact@v6
        with:
          name: HLSL-LSP-Visual-Studio-Code
          path: clients/vscode/hlsl-lsp-vscode.vsix
          if-no-files-found: error
