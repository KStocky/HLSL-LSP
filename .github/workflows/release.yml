name: Release editor VSIX packages

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-vsix:
    name: Build Visual Studio VSIX
    runs-on: windows-latest

    steps:
      - name: Check out HLSL-LSP
        uses: actions/checkout@v5

      - name: Build release server
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'

          cmake -S . -B out/build/release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_CXX_COMPILER=cl.exe" `
            -DBUILD_TESTING=OFF
          cmake --build out/build/release --target hlsl-lsp
          cmake --install out/build/release `
            --config Release `
            --prefix out/package/win32-x64

          cmake -S . -B out/build/release-repro -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_CXX_COMPILER=cl.exe" `
            -DBUILD_TESTING=OFF
          cmake --build out/build/release-repro --target hlsl-lsp
          if ((Get-FileHash out/build/release/hlsl-lsp.exe).Hash -ne `
              (Get-FileHash out/build/release-repro/hlsl-lsp.exe).Hash) {
            throw 'Release server build is not reproducible'
          }

      - name: Upload Windows x64 runtime
        uses: actions/upload-artifact@v6
        with:
          name: HLSL-LSP-Windows-x64-runtime
          path: out/package/win32-x64
          if-no-files-found: error

      - name: Build Visual Studio VSIX
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * `
            -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe |
            Select-Object -First 1
          & $msbuild `
            clients\visual-studio\HlslLsp.VisualStudio\HlslLsp.VisualStudio.csproj `
            /restore /p:Configuration=Release `
            /p:HlslLspServerDir="$env:GITHUB_WORKSPACE\out\build\release"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Normalize Visual Studio VSIX
        shell: pwsh
        run: |
          python tools/normalize_zip.py `
            clients/visual-studio/HlslLsp.VisualStudio/bin/Release/net472/HlslLsp.VisualStudio.vsix

          Copy-Item `
            clients/visual-studio/HlslLsp.VisualStudio/bin/Release/net472/HlslLsp.VisualStudio.vsix `
            out/HlslLsp.VisualStudio.first.vsix
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * `
            -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe |
            Select-Object -First 1
          & $msbuild `
            clients\visual-studio\HlslLsp.VisualStudio\HlslLsp.VisualStudio.csproj `
            /restore /t:Rebuild /p:Configuration=Release `
            /p:HlslLspServerDir="$env:GITHUB_WORKSPACE\out\build\release"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          python tools/normalize_zip.py `
            clients/visual-studio/HlslLsp.VisualStudio/bin/Release/net472/HlslLsp.VisualStudio.vsix
          if ((Get-FileHash out/HlslLsp.VisualStudio.first.vsix).Hash -ne `
              (Get-FileHash `
                clients/visual-studio/HlslLsp.VisualStudio/bin/Release/net472/HlslLsp.VisualStudio.vsix).Hash) {
            throw 'Visual Studio VSIX is not reproducible'
          }

      - name: Upload VSIX workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: HLSL-LSP-Visual-Studio
          path: clients/visual-studio/HlslLsp.VisualStudio/bin/Release/net472/HlslLsp.VisualStudio.vsix
          if-no-files-found: error

      - name: Attach VSIX to GitHub release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.event.release.tag_name }}' `
            clients/visual-studio/HlslLsp.VisualStudio/bin/Release/net472/HlslLsp.VisualStudio.vsix `
            --clobber

  build-linux-runtime:
    name: Build Linux x64 runtime
    runs-on: ubuntu-24.04

    steps:
      - name: Check out HLSL-LSP
        uses: actions/checkout@v5

      - name: Build and install release server
        shell: bash
        run: |
          cmake -S . -B out/build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTING=OFF
          cmake --build out/build/release --target hlsl-lsp
          cmake --install out/build/release \
            --config Release \
            --prefix out/package/linux-x64
          test -x out/package/linux-x64/hlsl-lsp
          test -f out/package/linux-x64/libdxcompiler.so
          readelf -d out/package/linux-x64/hlsl-lsp | grep -F '$ORIGIN'
          env -u LD_LIBRARY_PATH out/package/linux-x64/hlsl-lsp </dev/null
          cmake -S . -B out/build/release-repro -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTING=OFF
          cmake --build out/build/release-repro --target hlsl-lsp
          cmp out/build/release/hlsl-lsp out/build/release-repro/hlsl-lsp
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          tar --sort=name "--mtime=@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            -C out/package -czf out/HLSL-LSP-linux-x64.tar.gz linux-x64

      - name: Upload Linux x64 runtime for packaging
        uses: actions/upload-artifact@v6
        with:
          name: HLSL-LSP-Linux-x64-runtime
          path: out/package/linux-x64
          if-no-files-found: error

      - name: Upload Linux x64 archive
        uses: actions/upload-artifact@v6
        with:
          name: HLSL-LSP-Linux-x64
          path: out/HLSL-LSP-linux-x64.tar.gz
          if-no-files-found: error

      - name: Attach Linux runtime to GitHub release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.event.release.tag_name }}' \
            out/HLSL-LSP-linux-x64.tar.gz \
            --clobber

  build-vscode-vsix:
    name: Build Visual Studio Code VSIX
    needs:
      - build-vsix
      - build-linux-runtime
    runs-on: ubuntu-24.04

    steps:
      - name: Check out HLSL-LSP
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json

      - name: Download Windows x64 runtime
        uses: actions/download-artifact@v6
        with:
          name: HLSL-LSP-Windows-x64-runtime
          path: out/runtime/win32-x64

      - name: Download Linux x64 runtime
        uses: actions/download-artifact@v6
        with:
          name: HLSL-LSP-Linux-x64-runtime
          path: out/runtime/linux-x64

      - name: Install and stage VS Code client
        working-directory: clients/vscode
        shell: bash
        run: |
          npm ci
          npm run stage:runtime -- \
            --platform win32-x64 \
            --server-dir ../../out/runtime/win32-x64
          npm run stage:runtime -- \
            --platform linux-x64 \
            --server-dir ../../out/runtime/linux-x64

      - name: Check and test VS Code client
        working-directory: clients/vscode
        run: npm run check

      - name: Run extension-host smoke tests
        working-directory: clients/vscode
        run: xvfb-run -a npm run test:integration -- --bundled

      - name: Package VS Code VSIX
        working-directory: clients/vscode
        run: npm run package

      - name: Normalize VS Code VSIX
        shell: bash
        run: |
          python tools/normalize_zip.py clients/vscode/hlsl-lsp-vscode.vsix
          cp clients/vscode/hlsl-lsp-vscode.vsix out/hlsl-lsp-vscode.first.vsix
          npm --prefix clients/vscode run package
          python tools/normalize_zip.py clients/vscode/hlsl-lsp-vscode.vsix
          cmp out/hlsl-lsp-vscode.first.vsix clients/vscode/hlsl-lsp-vscode.vsix

      - name: Verify packaged Linux executable mode
        working-directory: clients/vscode
        shell: bash
        run: |
          zipinfo -l hlsl-lsp-vscode.vsix |
            grep -E '^-rwx.*extension/server/linux-x64/hlsl-lsp$'

      - name: Upload VS Code VSIX workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: HLSL-LSP-Visual-Studio-Code
          path: clients/vscode/hlsl-lsp-vscode.vsix
          if-no-files-found: error

      - name: Attach VS Code VSIX to GitHub release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.event.release.tag_name }}' \
            clients/vscode/hlsl-lsp-vscode.vsix \
            --clobber
